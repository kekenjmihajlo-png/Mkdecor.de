<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK Decor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
    linear-gradient(
        rgba(10,10,10,0.72),
        rgba(10,10,10,0.82)
    ),
    url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1600&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    overflow-x:hidden;
    position:relative;
}

/* LUXURY ROOM OVERLAY */

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
    radial-gradient(
        circle at top right,
        rgba(212,175,55,0.12),
        transparent 35%
    );
    pointer-events:none;
    z-index:0;
}

header{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    z-index:1;
    padding:20px;
}

header h1{
    font-size:80px;
    font-weight:bold;
    margin-bottom:20px;
}

header p{
    font-size:28px;
    color:#d4af37;
    margin-bottom:30px;
}

.btn{
    padding:15px 40px;
    border:none;
    border-radius:40px;
    background:#d4af37;
    color:black;
    font-size:18px;
    font-weight:bold;
    text-decoration:none;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(212,175,55,0.5);
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:35px;
    padding:80px 40px;
    position:relative;
    z-index:1;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(212,175,55,0.2);
    border-radius:25px;
    overflow:hidden;
    backdrop-filter:blur(8px);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 30px rgba(212,175,55,0.2);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.card h2{
    padding:20px 20px 10px;
    font-size:24px;
}

.price{
    padding:0 20px 25px;
    color:#d4af37;
    font-size:22px;
    font-weight:bold;
}

.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    padding:15px 25px;
    border-radius:40px;
    text-decoration:none;
    font-weight:bold;
    z-index:10;
}

@media(max-width:768px){

header h1{
    font-size:50px;
}

header p{
    font-size:20px;
}

}

</style>
</head>

<body>

<header>
    <h1>MK Decor</h1>
    <p>Luxury Handmade Decor • Handcrafted in Germany</p>

    <a href="#products" class="btn">
        Explore Collection
    </a>
</header>

<section class="products" id="products">

    <div class="card">
        <img src="https://i.imgur.com/ddREOMl.jpeg "alt="Vase">
        <h2>Terra</h2>
        <div class="price">16€</div>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/nuqr38l.jpeg "alt="Vase">
        <h2>Luna</h2>
        <div class="price">17€</div>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/vfX8bPB.jpeg "alt="Vase">
        <h2>Noir Wood</h2>
        <div class="price">20€</div>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/bnw3jVV.jpeg "alt="Vase">
        <h2>Oak Flow</h2>
        <div class="price">13€</div>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/bWKfjfE.jpeg "alt="Vase">
        <h2>Velvet Shape</h2>
        <div class="price">15€</div>
    </div>

    <div class="card">
        <img src="https://imgur.com/9DkGJyV.jpeg "alt="Vase">
        <h2>Nordic Form</h2>
        <div class="price">14€</div>
    </div>

</section>

<a class="whatsapp" href="https://wa.me/41782328393">
    WhatsApp
</a>

</body>
</html>
