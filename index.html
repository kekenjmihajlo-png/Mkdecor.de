<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MK Decor</title>

<style>

body{
margin:0;
padding:0;
background:#0f0f0f;
font-family:Arial,sans-serif;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(
120deg,
transparent 0%,
rgba(255,215,0,0.12) 45%,
transparent 55%
);
background-size:300% 300%;
animation:goldMove 6s linear infinite;
pointer-events:none;
z-index:1;
mix-blend-mode:screen;
}

@keyframes goldMove{
0%{
background-position:0% 50%;
}
100%{
background-position:100% 50%;
}
}

.container{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
position:relative;
z-index:2;
}

h1{
font-size:70px;
margin-bottom:20px;
}

p{
font-size:24px;
color:#ddd;
margin-bottom:30px;
}

button{
padding:15px 35px;
border:none;
border-radius:40px;
background:gold;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="container">
<h1>MK Decor</h1>

<p>Luxury Handmade Decor • Handcrafted in Germany</p>

<button>Explore Collection</button>
</div>

</body>
</html>
