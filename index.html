<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK Decor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
    linear-gradient(
        135deg,
        #0f0f0f 0%,
        #1a120d 35%,
        #111111 100%
    );
    color:white;
    overflow-x:hidden;
    position:relative;
}

/* GOLD LINES */

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
    repeating-linear-gradient(
        130deg,
        transparent 0px,
        transparent 180px,
        rgba(212,175,55,0.08) 182px,
        rgba(212,175,55,0.18) 184px,
        transparent 186px,
        transparent 360px
    );
    pointer-events:none;
    z-index:0;
}

/* SOFT GLOW */

body::after{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
    radial-gradient(
        circle at top right,
        rgba(212,175,55,0.10),
        transparent 40%
    );
    pointer-events:none;
    z-index:0;
}

header{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    z-index:1;
    padding:20px;
}

header h1{
    font-size:80px;
    font-weight:bold;
    margin-bottom:20px;
}

header p{
    font-size:28px;
    color:#d4af37;
    margin-bottom:30px;
}

.btn{
    padding:15px 40px;
    border:none;
    border-radius:40px;
    background:#d4af37;
    color:black;
    font-size:18px;
    font-weight:bold;
    text-decoration:none;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(212,175,55,0.5);
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:35px;
    padding:80px 40px;
    position:relative;
    z-index:1;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(212,175,55,0.2);
    border-radius:25px;
    overflow:hidden;
    backdrop-filter:blur(8px);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 30px rgba(212,175,55,0.2);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.card h2{
    padding:20px 20px 10px;
    font-size:24px;
}

.price{
    padding:0 20px 25px;
    color:#d4af37;
    font-size:22px;
    font-weight:bold;
}

.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    padding:15px 25px;
    border-radius:40px;
    text-decoration:none;
    font-weight:bold;
    z-index:10;
}

@media(max-width:768px){

header h1{
    font-size:50px;
}

header p{
    font-size:20px;
}

}

</style>
</head>

<body>

<header>
    <h1>MK Decor</h1>
    <p>Luxury Handmade Decor • Handcrafted in Germany</p>

    <a href="#products" class="btn">
        Explore Collection
    </a>
</header>

<section class="products" id="products">

    <div class="card">
        <img src="https://i.imgur.com/8Km9tLL.jpg" alt="Vase">
        <h2>Wave Vase</h2>
        <div class="price">29€</div>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/jNNT4LE.jpg" alt="Vase">
        <h2>Modern Wood Vase</h2>
        <div class="price">34€</div>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/2DsA49b.jpg" alt="Vase">
        <h2>Luxury Decor Vase</h2>
        <div class="price">39€</div>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/3ZQ3Z6v.jpg" alt="Vase">
        <h2>Elegant Wood Art</h2>
        <div class="price">32€</div>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/fHyEMsl.jpg" alt="Vase">
        <h2>Minimal Gold Vase</h2>
        <div class="price">27€</div>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/ZXBtVw7.jpg" alt="Vase">
        <h2>Handmade Luxury Piece</h2>
        <div class="price">42€</div>
    </div>

</section>

<a class="whatsapp" href="https://wa.me/49123456789">
    WhatsApp
</a>

</body>
</html>
